<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark light" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <title>Web Development Company in Sri Lanka | Jawrah Pixel</title>
    <meta name="description" content="Jawrah Pixel is a Sri Lankan digital agency building custom websites, software, ecommerce platforms, mobile apps and SEO strategies for ambitious businesses." />
    <meta property="og:title" content="Web Development Company in Sri Lanka | Jawrah Pixel" />
    <meta property="og:description" content="Jawrah Pixel is a Sri Lankan digital agency building custom websites, software, ecommerce platforms, mobile apps and SEO strategies for ambitious businesses." />
    <link rel="icon" type="image/png" href="/assets/logo.png" />
    <link rel="apple-touch-icon" href="/assets/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" />
    <link rel="preload" href="/assets/logo.png" as="image" />
    <link rel="preload" href="/assets/logo-white.png" as="image" />
    <link rel="preload" href="/assets/logo-navbar.png" as="image" type="image/png" />
    <link rel="preload" href="/assets/logo-navbar-white.png" as="image" type="image/png" />
    <!-- Prevent FOUC - Theme Initialization Script -->
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('jawrah-theme');
          const theme = stored === 'light' || stored === 'dark' ? stored : 'dark';
          const root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(theme);
          root.dataset.theme = theme;
          root.style.colorScheme = theme;
          window.__JAWRAH_INITIAL_THEME__ = theme;
          // Set initial meta theme-color
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'dark' ? '#000000' : '#FFFFFF');
        } catch (e) {
          document.documentElement.classList.add('dark');
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>
    <!-- Google Analytics 4 (GA4) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-CNEZLRQ2C3"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-CNEZLRQ2C3', {
        send_page_view: false // We will handle page views manually in React to support SPA routing
      });
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Lightweight CSS-only splash screen to prevent any blank screen while scripts load -->
      <style>
        #initial-splash {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background-color: #05070B;
          color: #94a3b8;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
          z-index: 99999;
          transition: opacity 0.3s ease;
        }
        html.light #initial-splash {
          background-color: #FFFFFF;
          color: #64748b;
        }
        .splash-top-bar {
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          height: 2.5px;
          background: rgba(59, 130, 246, 0.15);
          overflow: hidden;
        }
        .splash-top-bar-inner {
          width: 50%;
          height: 100%;
          background: linear-gradient(90deg, transparent, #3b82f6, #06b6d4);
          animation: splashSlide 1.5s infinite ease-in-out;
        }
        .splash-logo-container {
          position: relative;
          display: flex;
          align-items: center;
          justify-content: center;
          margin-bottom: 24px;
        }
        .splash-logo-glow {
          position: absolute;
          inset: -12px;
          border-radius: 9999px;
          background: radial-gradient(circle, rgba(6, 182, 212, 0.25) 0%, transparent 70%);
          animation: splashPulse 2.4s infinite ease-in-out;
        }
        .splash-logo-img {
          width: 64px;
          height: 64px;
          object-fit: contain;
          position: relative;
          z-index: 2;
        }
        .splash-text {
          font-size: 11px;
          letter-spacing: 0.28em;
          text-transform: uppercase;
          font-family: monospace;
          opacity: 0.8;
        }
        @keyframes splashSlide {
          0% { transform: translateX(-100%); }
          100% { transform: translateX(200%); }
        }
        @keyframes splashPulse {
          0%, 100% { transform: scale(0.92); opacity: 0.3; }
          50% { transform: scale(1.1); opacity: 0.7; }
        }
      </style>
      <div id="initial-splash">
        <div class="splash-top-bar">
          <div class="splash-top-bar-inner"></div>
        </div>
        <div class="splash-logo-container">
          <div class="splash-logo-glow"></div>
          <img src="/assets/logo.png" alt="Jawrah Pixel" class="splash-logo-img" />
        </div>
        <div class="splash-text">Jawrah Pixel</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
